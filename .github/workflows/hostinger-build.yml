name: Build Hostinger static site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and mirror Hostinger output
        run: npm run build:hostinger

      - name: Commit generated deployment files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .htaccess assets
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore: refresh Hostinger build [skip ci]"
            git push
          fi
